name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os-classifier: [linux, mac, win, mac-aarch64]

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build Fat Jar for ${{ matrix.os-classifier }}
        run: ./gradlew shadowJar -PtargetOs=${{ matrix.os-classifier }} -x test

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: donkeykong-jar-${{ matrix.os-classifier }}
          path: build/libs/*-fat-${{ matrix.os-classifier }}.jar
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Run Tests
        run: ./gradlew test

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install Semantic Release
        run: npm install -g semantic-release @semantic-release/git @semantic-release/github @semantic-release/changelog
      - name: Run Tests
        run: ./gradlew test

      - name: Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
